name: Release
permissions: read-all

on:
  release:
    types:
      - created

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inditextech/redkey-robin
  OPERATOR_REF: main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      user_agent_version: ${{ steps.version.outputs.user_agent_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Load Robin version
        id: version
        run: |
          echo "version=$(make version)" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_OUTPUT"

  check:
    name: Check versions
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check versions
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "version: ${{ needs.release.outputs.version }}"
          echo "tag_name: $RELEASE_TAG_NAME"

          if [ "$RELEASE_TAG_NAME" != "${{ needs.release.outputs.version }}" ]; then
            echo "Version in Makefile does not match release tag"
            exit 1
          fi

  build:
    name: Build Robin image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          path: redkey-robin

      - name: Checkout operator API
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: InditexTech/redkey-operator
          ref: ${{ env.OPERATOR_REF }}
          path: redkey-operator

      - name: Login into ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push multi-arch Robin image
        working-directory: redkey-robin
        run: |
          make docker-buildx IMAGE_TAG_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} OPERATOR_DIR=../redkey-operator
